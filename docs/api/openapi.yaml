openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Syrian Marketplace API contract
  version: 1.0.0
  summary: Contract-first release-one API; only health is currently wired.
  description:
    Canonical target contract, not a claim of implemented business endpoints. Local simulated payments
    only; no live ShamCash. All pricing, commission, escrow and transitions execute on backend. See ORDER_STATE_MACHINES.md
    and order-transitions.json for every actor/guard/effect.
servers:
  - url: http://localhost:4000
    description: Local simulator; use HTTPS for deployment
tags:
  - name: Admin
    description: Admin operations
  - name: Auth
    description: Auth operations
  - name: Catalog
    description: Catalog operations
  - name: Chat
    description: Chat operations
  - name: Delivery
    description: Delivery operations
  - name: Disputes
    description: Disputes operations
  - name: Files
    description: Files operations
  - name: Geography
    description: Geography operations
  - name: Infrastructure
    description: Infrastructure operations
  - name: Notifications
    description: Notifications operations
  - name: Orders
    description: Orders operations
  - name: Payments
    description: Payments operations
  - name: Profiles
    description: Profiles operations
  - name: Quotes
    description: Quotes operations
  - name: Reviews
    description: Reviews operations
security:
  - bearerAuth: []
