name: Database and contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace_ci
          POSTGRES_USER: marketplace_ci
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace_ci -d marketplace_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://marketplace_ci:ci-test-only@localhost:5432/marketplace_ci?schema=public
      DATABASE_TEST_URL: postgresql://marketplace_ci:ci-test-only@localhost:5432/marketplace_ci?schema=public
      ALLOW_DEMO_SEED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:setup
      - run: npm run db:generate
      - run: npm run db:validate --workspace backend
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run contracts:validate
      - run: npm run contracts:check
      - run: npm run db:erd:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:test
      - run: npm run build
