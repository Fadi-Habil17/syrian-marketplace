  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - Infrastructure
      summary: Process liveness
      description: Public liveness; not database readiness.
      x-implementation-status: implemented
      x-permissions:
        - Public liveness; not database readiness.
      parameters: []
      responses:
        '200':
          description: Successful result
          headers:
            X-Request-Id:
              schema:
                type: string
                maxLength: 128
                minLength: 1
          content:
            application/json:
              schema:
