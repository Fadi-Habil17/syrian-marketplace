        minLength: 1
        maxLength: 128
      description:
        Actor/route/key scoped, request-hash bound. Reuse same key on timeout; different body -> 409.
        Permanent installment/settlement operation keys prevent duplicates across different client keys.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        examples:
          - '"1"'
      description:
        Quoted current parent order.version. Rechecked under lock; stale version -> VERSION_CONFLICT.
        Idempotency replay may return original result despite stale version.
